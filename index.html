<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DORK CANDY ✧ Bug Bounty Dork Engine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#fef3e2;
  --panel:#fffdf7;
  --ink:#1a1a2e;
  --line:#1a1a2e;
  --pink:#ff9ec4;
  --mint:#9be7c4;
  --lav:#c4b5fd;
  --sky:#a5d8ff;
  --yellow:#ffe066;
  --peach:#ffc09f;
  --red:#ff6b6b;
  --shadow:6px 6px 0 var(--ink);
  --shadow-sm:3px 3px 0 var(--ink);
  --shadow-lg:9px 9px 0 var(--ink);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Space Grotesk',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  background-image:radial-gradient(var(--ink) 1.1px,transparent 1.1px);
  background-size:26px 26px;
  color:var(--ink);
  display:flex;
  height:100vh;
  overflow:hidden;
}
::selection{background:var(--pink);color:var(--ink)}

/* ---------- Sidebar ---------- */
.sidebar{
  width:300px;
  flex-shrink:0;
  background:var(--panel);
  border-right:4px solid var(--line);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.brand{
  padding:20px;
  border-bottom:4px solid var(--line);
  background:var(--pink);
}
.brand h1{
  font-size:1.6rem;
  font-weight:700;
  letter-spacing:-1px;
  display:flex;align-items:center;gap:8px;
}
.brand .tag{
  font-family:var(--mono);
  font-size:.62rem;
  margin-top:6px;
  background:var(--ink);
  color:var(--yellow);
  display:inline-block;
  padding:3px 8px;
  border-radius:2px;
  letter-spacing:1px;
}
.nav{flex:1;overflow-y:auto;padding:14px}
.nav-label{
  font-family:var(--mono);
  font-size:.6rem;
  letter-spacing:2px;
  opacity:.55;
  margin:14px 6px 8px;
  text-transform:uppercase;
}
.nav-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:11px 12px;
  margin-bottom:9px;
  background:var(--panel);
  border:3px solid var(--line);
  border-radius:10px;
  cursor:pointer;
  font-family:var(--sans);
  font-size:.86rem;
  font-weight:600;
  text-align:left;
  box-shadow:var(--shadow-sm);
  transition:transform .08s,box-shadow .08s,background .15s;
}
.nav-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.nav-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.nav-btn.active{background:var(--lav)}
.nav-btn .left{display:flex;align-items:center;gap:9px;overflow:hidden}
.nav-btn .emoji{font-size:1.1rem;flex-shrink:0}
.nav-btn .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{
  font-family:var(--mono);
  font-size:.68rem;
  font-weight:700;
  background:var(--ink);
  color:#fff;
  padding:2px 7px;
  border-radius:20px;
  flex-shrink:0;
}
.nav-btn.active .count{background:var(--pink);color:var(--ink)}

.sidebar-foot{
  border-top:4px solid var(--line);
  padding:12px 14px;
  display:flex;
  gap:8px;
}
.theme-dot{
  width:26px;height:26px;
  border:3px solid var(--line);
  border-radius:50%;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .08s;
}
.theme-dot:hover{transform:scale(1.12)}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.topbar{
  background:var(--panel);
  border-bottom:4px solid var(--line);
  padding:16px 22px;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}
.field{position:relative;flex:1;min-width:240px}
.field .pre{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:.72rem;font-weight:700;
  background:var(--mint);border:2px solid var(--line);border-radius:4px;
  padding:2px 6px;pointer-events:none;
}
input,select{
  font-family:var(--mono);
  font-size:.92rem;
  color:var(--ink);
  background:#fff;
  border:3px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  box-shadow:var(--shadow-sm);
  outline:none;
}
input:focus,select:focus{box-shadow:var(--shadow);transform:translate(-1px,-1px)}
#target{width:100%;padding-left:74px;font-weight:600}
#search{width:100%;padding-left:40px}
.field.search .pre{background:transparent;border:none;left:12px;font-size:1rem}
select{cursor:pointer;font-weight:600;font-family:var(--sans)}

.btn{
  font-family:var(--sans);
  font-weight:700;
  font-size:.85rem;
  border:3px solid var(--line);
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:transform .08s,box-shadow .08s;
  display:inline-flex;align-items:center;gap:7px;
  white-space:nowrap;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn-pink{background:var(--pink)}
.btn-mint{background:var(--mint)}
.btn-yellow{background:var(--yellow)}
.btn-sky{background:var(--sky)}
.btn-lav{background:var(--lav)}
.btn-ghost{background:#fff}

/* engine chips */
.engines{
  background:var(--panel);
  border-bottom:4px solid var(--line);
  padding:12px 22px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.engines .lbl{font-family:var(--mono);font-size:.62rem;letter-spacing:1.5px;opacity:.6;text-transform:uppercase}
.chip{
  font-family:var(--mono);
  font-size:.74rem;
  font-weight:700;
  border:2px solid var(--line);
  border-radius:20px;
  padding:6px 12px;
  background:#fff;
  cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);
  transition:transform .07s,box-shadow .07s;
  display:flex;align-items:center;gap:6px;
}
.chip:hover{transform:translate(-1px,-1px)}
.chip.on{background:var(--sky)}
.chip .grp{font-size:.6rem;opacity:.5}

/* controls row */
.controls{
  padding:14px 22px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border-bottom:4px solid var(--line);
  background:var(--bg);
}
.delaybox{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);
  border:3px solid var(--line);border-radius:10px;
  padding:7px 14px;box-shadow:var(--shadow-sm);
}
.delaybox label{font-size:.75rem;font-weight:600}
input[type=range]{padding:0;border:none;box-shadow:none;width:110px;accent-color:var(--pink);cursor:pointer}
.delay-val{font-family:var(--mono);font-weight:700;background:var(--yellow);border:2px solid var(--line);border-radius:5px;padding:1px 7px;font-size:.78rem}
.spacer{flex:1}
.stat{
  font-family:var(--mono);font-size:.74rem;font-weight:700;
  background:var(--panel);border:3px solid var(--line);border-radius:10px;
  padding:8px 12px;box-shadow:var(--shadow-sm);
  display:flex;gap:7px;align-items:center;
}
.stat b{background:var(--mint);padding:0 6px;border-radius:4px;border:1.5px solid var(--line)}

/* content */
.content{flex:1;overflow-y:auto;padding:22px}
.section-head{margin-bottom:18px}
.section-head h2{font-size:1.7rem;letter-spacing:-1px;display:flex;align-items:center;gap:10px}
.section-head p{font-size:.9rem;opacity:.7;margin-top:4px;max-width:680px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:18px;
}
.card{
  background:var(--panel);
  border:3px solid var(--line);
  border-radius:14px;
  padding:16px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:11px;
  transition:transform .1s,box-shadow .1s;
}
.card:hover{transform:translate(-3px,-3px);box-shadow:var(--shadow-lg)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-title{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1rem;line-height:1.2}
.card-title .em{font-size:1.3rem}
.sev{
  font-family:var(--mono);font-size:.58rem;font-weight:700;letter-spacing:.5px;
  border:2px solid var(--line);border-radius:20px;padding:2px 8px;text-transform:uppercase;flex-shrink:0;
}
.sev.info{background:var(--sky)}
.sev.low{background:var(--mint)}
.sev.med{background:var(--yellow)}
.sev.high{background:var(--peach)}
.sev.crit{background:var(--red);color:#fff}
.card-desc{font-size:.82rem;opacity:.72;line-height:1.4}
.dork-box{
  font-family:var(--mono);font-size:.76rem;line-height:1.5;
  background:var(--bg);
  border:2px dashed var(--line);
  border-radius:8px;
  padding:10px 12px;
  word-break:break-word;
  max-height:140px;overflow:auto;
}
.dork-box .hl{background:var(--pink);border-radius:3px;padding:0 3px;font-weight:700}
.card-acts{display:flex;gap:8px;margin-top:auto}
.card-acts .btn{flex:1;justify-content:center;padding:9px;font-size:.78rem}
.fav{
  border:3px solid var(--line);border-radius:10px;background:#fff;
  width:40px;flex:0 0 40px !important;font-size:1rem;
  box-shadow:var(--shadow-sm);cursor:pointer;
}
.fav.on{background:var(--yellow)}

.empty{
  text-align:center;padding:70px 20px;opacity:.6;
  font-family:var(--mono);font-size:.95rem;
}
.empty .big{font-size:3rem;display:block;margin-bottom:10px}

/* custom builder modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(26,26,46,.45);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--panel);border:4px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-lg);padding:24px;width:100%;max-width:520px;
}
.modal h3{font-size:1.3rem;margin-bottom:6px}
.modal p{font-size:.82rem;opacity:.7;margin-bottom:16px}
.modal label{font-size:.72rem;font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;display:block;margin:12px 0 5px}
.modal input,.modal textarea{width:100%;font-family:var(--mono);font-size:.85rem;background:#fff;border:3px solid var(--line);border-radius:10px;padding:11px;box-shadow:var(--shadow-sm)}
.modal textarea{min-height:80px;resize:vertical}
.modal-acts{display:flex;gap:10px;margin-top:20px}
.modal-acts .btn{flex:1;justify-content:center}

/* toast */
.toast{
  position:fixed;bottom:26px;right:26px;
  background:var(--ink);color:#fff;
  border:3px solid var(--ink);border-radius:12px;
  padding:14px 18px;min-width:240px;
  box-shadow:6px 6px 0 var(--pink);
  transform:translateY(140%);transition:transform .35s cubic-bezier(.2,1.3,.4,1);
  z-index:200;
}
.toast.show{transform:translateY(0)}
.toast .t{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px}
.toast .m{font-size:.78rem;opacity:.85;margin-top:3px;font-family:var(--mono)}

/* scrollbars */
.nav::-webkit-scrollbar,.content::-webkit-scrollbar,.dork-box::-webkit-scrollbar{width:10px;height:10px}
.nav::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.dork-box::-webkit-scrollbar-thumb{background:var(--ink);border-radius:10px;border:2px solid var(--bg)}
.nav::-webkit-scrollbar-track,.content::-webkit-scrollbar-track{background:transparent}

@media(max-width:780px){
  .sidebar{position:fixed;z-index:50;height:100%;transform:translateX(-100%);transition:transform .25s}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:inline-flex !important}
}
.menu-toggle{display:none}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <h1>🍬 DORK CANDY</h1>
    <span class="tag">BUG BOUNTY DORK ENGINE v4</span>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="sidebar-foot" id="themes"></div>
</aside>

<main class="main">
  <div class="topbar">
    <button class="btn btn-ghost menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div class="field">
      <span class="pre">TARGET</span>
      <input id="target" placeholder="example.com" autocomplete="off" spellcheck="false">
    </div>
    <div class="field search">
      <span class="pre">🔍</span>
      <input id="search" placeholder="Filter dorks across all categories…  (press /)" autocomplete="off">
    </div>
  </div>

  <div class="engines" id="engines"><span class="lbl">Engines</span></div>

  <div class="controls">
    <button class="btn btn-pink" onclick="runAll()">▶ Run All</button>
    <button class="btn btn-mint" onclick="copyAll()">⧉ Copy All</button>
    <button class="btn btn-sky" onclick="exportAll()">⬇ Export .txt</button>
    <button class="btn btn-lav" onclick="openBuilder()">✨ Custom Dork</button>
    <div class="delaybox">
      <label>Delay</label>
      <input type="range" id="delay" min="0" max="5" step="0.5" value="1">
      <span class="delay-val" id="delay-val">1s</span>
    </div>
    <div class="spacer"></div>
    <div class="stat">📊 <span id="stat-cat">0</span> shown</div>
    <div class="stat">📦 Total <b id="stat-total">0</b></div>
    <div class="stat">⭐ <b id="stat-fav">0</b></div>
  </div>

  <div class="content">
    <div class="section-head">
      <h2 id="sec-title">🎯 Loading…</h2>
      <p id="sec-desc"></p>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>✨ Custom Dork Builder</h3>
    <p>Use <b>%D%</b> where the target domain should go. It will be saved to your Favorites.</p>
    <label>Title</label>
    <input id="cd-title" placeholder="My juicy dork">
    <label>Dork query</label>
    <textarea id="cd-dork" placeholder='site:%D% inurl:admin intext:"password"'></textarea>
    <div class="modal-acts">
      <button class="btn btn-ghost" onclick="closeBuilder()">Cancel</button>
      <button class="btn btn-pink" onclick="saveCustom()">💾 Save &amp; Run</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><div class="t" id="toast-t"></div><div class="m" id="toast-m"></div></div>

<script>
const P = "%D%"; // domain placeholder token

/* ============ ENGINE URLS (verified correct) ============ */
const b64 = s => btoa(unescape(encodeURIComponent(s)));
const E = encodeURIComponent;
const ENGINES = {
  google:     {name:"Google",     grp:"web",   url:q=>`https://www.google.com/search?q=${E(q)}&num=100`},
  bing:       {name:"Bing",       grp:"web",   url:q=>`https://www.bing.com/search?q=${E(q)}`},
  duck:       {name:"DuckDuckGo", grp:"web",   url:q=>`https://duckduckgo.com/?q=${E(q)}`},
  brave:      {name:"Brave",      grp:"web",   url:q=>`https://search.brave.com/search?q=${E(q)}`},
  yandex:     {name:"Yandex",     grp:"web",   url:q=>`https://yandex.com/search/?text=${E(q)}`},
  startpage:  {name:"Startpage",  grp:"web",   url:q=>`https://www.startpage.com/sp/search?query=${E(q)}`},
  baidu:      {name:"Baidu",      grp:"web",   url:q=>`https://www.baidu.com/s?wd=${E(q)}`},
  shodan:     {name:"Shodan",     grp:"recon", url:q=>`https://www.shodan.io/search?query=${E(q)}`},
  censys:     {name:"Censys",     grp:"recon", url:q=>`https://search.censys.io/search?resource=hosts&q=${E(q)}`},
  fofa:       {name:"FOFA",       grp:"recon", url:q=>`https://en.fofa.info/result?qbase64=${E(b64(q))}`},
  zoomeye:    {name:"ZoomEye",    grp:"recon", url:q=>`https://www.zoomeye.org/searchResult?q=${E(q)}`},
  netlas:     {name:"Netlas",     grp:"recon", url:q=>`https://app.netlas.io/responses/?q=${E(q)}`},
  github:     {name:"GitHub",     grp:"code",  url:q=>`https://github.com/search?q=${E(q)}&type=code`},
  grep:       {name:"grep.app",   grp:"code",  url:q=>`https://grep.app/search?q=${E(q)}`},
  wayback:    {name:"Wayback",    grp:"recon", url:q=>`https://web.archive.org/web/*/${q.replace(/^site:/,'').split(' ')[0]}*`},
};
let selectedEngines = new Set(["google"]);

/* ============ DORK DATABASE (smarter, deduped, severity-rated) ============ */
const DB = {
  "Bug Bounty Programs":{emoji:"🎯",desc:"Find live programs, disclosure policies, and security contacts.",dorks:[
    {em:"📄",t:"security.txt",d:"RFC 9116 security contact files",s:"info",q:`site:${P} inurl:"/.well-known/security.txt"`},
    {em:"🏆",t:"Disclosure / VDP pages",d:"Responsible-disclosure & policy pages",s:"info",q:`site:${P} (inurl:bug-bounty | inurl:responsible-disclosure | inurl:vulnerability-disclosure | inurl:security/policy)`},
    {em:"🔷",t:"HackerOne (self-hosted)",d:"H1-powered pages off-platform",s:"info",q:`"submit a report" ("hackerone" | inurl:hackerone.com) site:${P}`},
    {em:"🐦",t:"Bugcrowd (self-hosted)",d:"Bugcrowd-powered programs",s:"info",q:`("bugcrowd" | inurl:bugcrowd.com) site:${P}`},
    {em:"💰",t:"Reward / Bounty mentions",d:"Pages promising rewards",s:"info",q:`site:${P} intext:("bug bounty" | "security reward" | "swag") intext:"vulnerability"`},
    {em:"✉️",t:"Security contact emails",d:"security@/abuse@ addresses",s:"info",q:`site:${P} (intext:"security@" | intext:"abuse@" | intext:"psirt")`},
  ]},

  "Recon & Subdomains":{emoji:"📡",desc:"Map the attack surface: subdomains, dev/staging hosts, and parameters.",dorks:[
    {em:"🕸️",t:"All subdomains",d:"Everything except www",s:"info",q:`site:*.${P} -www`},
    {em:"🧪",t:"Dev / staging / test",d:"Non-prod environments",s:"med",q:`site:*.${P} (inurl:dev | inurl:staging | inurl:test | inurl:uat | inurl:qa | inurl:demo | inurl:sandbox)`},
    {em:"🚪",t:"Internal / hidden hosts",d:"VPN, internal, admin subdomains",s:"high",q:`site:*.${P} (inurl:internal | inurl:admin | inurl:vpn | inurl:jenkins | inurl:gitlab | inurl:jira)`},
    {em:"❓",t:"URLs with parameters",d:"Dynamic endpoints to fuzz",s:"low",q:`site:${P} inurl:(? | & | =) -inurl:(.html | .png | .jpg | .css | .js)`},
    {em:"📁",t:"Open directory listings",d:"Index Of… exposures",s:"med",q:`site:${P} intitle:"index of" -inurl:(html | htm | php | asp)`},
    {em:"🔗",t:"Redirect & proxy params",d:"url=/next=/dest= endpoints",s:"med",q:`site:${P} inurl:(url= | next= | redirect= | dest= | return= | continue=)`},
    {em:"🗺️",t:"Sitemaps",d:"XML sitemaps for endpoint discovery",s:"info",q:`site:${P} (inurl:sitemap.xml | inurl:sitemap_index.xml | filetype:xml inurl:sitemap)`},
  ]},

  "Sensitive Files & Secrets":{emoji:"🔑",desc:"Exposed configs, env files, keys, dumps, and backups.",dorks:[
    {em:"🧬",t:".env files",d:"DB_PASSWORD / API keys in env",s:"crit",q:`site:${P} ext:env (intext:"DB_PASSWORD" | intext:"APP_KEY" | intext:"SECRET" | intext:"API_KEY")`},
    {em:"⚙️",t:"Config files",d:"conf / cfg / ini / yml secrets",s:"high",q:`site:${P} ext:(conf | cfg | ini | yml | yaml | config) (intext:password | intext:secret | intext:token)`},
    {em:"🗄️",t:"Database dumps",d:"SQL exports with INSERT/CREATE",s:"crit",q:`site:${P} ext:sql (intext:"INSERT INTO" | intext:"CREATE TABLE" | intext:"DROP TABLE")`},
    {em:"🔀",t:".git exposure",d:"Exposed git config / HEAD",s:"high",q:`site:${P} (inurl:"/.git/config" | inurl:"/.git/HEAD" | intitle:"index of" ".git")`},
    {em:"📝",t:"WordPress wp-config",d:"wp-config backups",s:"crit",q:`site:${P} (inurl:wp-config.php.bak | inurl:wp-config.php.save | inurl:wp-config.txt | inurl:wp-config.old)`},
    {em:"🔐",t:"Private keys",d:"RSA/SSH/PEM key material",s:"crit",q:`site:${P} (intext:"BEGIN RSA PRIVATE KEY" | intext:"BEGIN OPENSSH PRIVATE KEY" | ext:pem | ext:ppk)`},
    {em:"☁️",t:"AWS keys",d:"AKIA / access key IDs",s:"crit",q:`site:${P} (intext:"AKIA" | intext:"aws_access_key_id" | intext:"aws_secret_access_key")`},
    {em:"📜",t:"Log files",d:"Logs leaking creds/tokens",s:"high",q:`site:${P} ext:log (intext:password | intext:error | intext:exception | intext:"api_key")`},
    {em:"📦",t:"Backups & archives",d:"bak / old / zip / tar.gz",s:"high",q:`site:${P} ext:(bak | old | backup | zip | tar | gz | 7z | rar) -ext:html`},

/* ============ STATE ============ */
let currentCat = Object.keys(DB)[0];
let domain = "";
let filter = "";
const FAV_KEY="dorkcandy_favs", THEME_KEY="dorkcandy_theme";
let favs = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");

const THEMES={
  candy:{pink:"#ff9ec4",mint:"#9be7c4",lav:"#c4b5fd",sky:"#a5d8ff",yellow:"#ffe066",peach:"#ffc09f",bg:"#fef3e2"},
  bubblegum:{pink:"#ff8fab",mint:"#caffbf",lav:"#bdb2ff",sky:"#a0c4ff",yellow:"#fdffb6",peach:"#ffd6a5",bg:"#fff0f6"},
  matcha:{pink:"#f4a8c0",mint:"#b7e4c7",lav:"#cdb4db",sky:"#b8e0d2",yellow:"#f9e784",peach:"#ffcb91",bg:"#f1f7ed"},
  blueberry:{pink:"#cdb4db",mint:"#a2d2ff",lav:"#bde0fe",sky:"#90dbf4",yellow:"#ffd670",peach:"#f7a8b8",bg:"#eef2ff"},
};

/* ============ HELPERS ============ */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function build(q){return domain ? q.split(P).join(domain) : q}
function highlight(q){
  let h = esc(q);
  if(domain){h=h.split(esc(domain)).join(`<span class="hl">${esc(domain)}</span>`);}
  else{h=h.split(esc(P)).join(`<span class="hl">${esc(P)}</span>`);}
  return h;
}
function favId(cat,t){return cat+"::"+t}
function isFav(cat,t){return favs.some(f=>f.id===favId(cat,t))}

/* allDorks incl. favorites virtual category */
function catData(cat){
  if(cat==="⭐ Favorites"){
    return {emoji:"⭐",desc:"Your starred and custom dorks. Saved locally in your browser.",
      dorks:favs.map(f=>({em:f.em||"⭐",t:f.t,d:f.d||"Saved dork",s:f.s||"info",q:f.q,eng:f.eng,_fav:true,_srcCat:f.srcCat}))};
  }
  return DB[cat];
}

/* ============ RENDER ============ */
function renderNav(){
  const nav=document.getElementById("nav");
  let html=`<div class="nav-label">Categories</div>`;
  html+=navBtn("⭐ Favorites","⭐",favs.length);
  Object.keys(DB).forEach(c=>html+=navBtn(c,DB[c].emoji,DB[c].dorks.length));
  nav.innerHTML=html;
}
function navBtn(cat,emoji,n){
  return `<button class="nav-btn ${cat===currentCat?'active':''}" onclick="switchCat('${cat.replace(/'/g,"\\'")}')">
    <span class="left"><span class="emoji">${emoji}</span><span class="name">${cat}</span></span>
    <span class="count">${n}</span></button>`;
}

function renderEngines(){
  const box=document.getElementById("engines");
  let html=`<span class="lbl">Engines</span>`;
  for(const [k,e] of Object.entries(ENGINES)){
    html+=`<button class="chip ${selectedEngines.has(k)?'on':''}" onclick="toggleEngine('${k}')">${e.name}<span class="grp">${e.grp}</span></button>`;
  }
  box.innerHTML=html;
}

function renderGrid(){
  const data=catData(currentCat);
  document.getElementById("sec-title").innerHTML=`${data.emoji} ${currentCat}`;
  document.getElementById("sec-desc").textContent=data.desc;
  const grid=document.getElementById("grid");
  let list=data.dorks.map((d,i)=>({...d,_i:i}));
  if(filter){
    const f=filter.toLowerCase();
    list=list.filter(d=>(d.t+" "+d.d+" "+d.q).toLowerCase().includes(f));
  }
  document.getElementById("stat-cat").textContent=list.length;
  if(!list.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><span class="big">🍭</span>No dorks here${filter?` for “${esc(filter)}”`:''}.</div>`;
    return;
  }
  grid.innerHTML=list.map(d=>{
    const fav=isFav(d._srcCat||currentCat,d.t);
    const engBadge=d.eng?`<span class="sev info" title="Best engine">${ENGINES[d.eng]?.name||d.eng}</span>`:"";
    return `<div class="card">
      <div class="card-top">
        <div class="card-title"><span class="em">${d.em}</span><span>${esc(d.t)}</span></div>
        <span class="sev ${d.s}">${d.s}</span>
      </div>
      <div class="card-desc">${esc(d.d)} ${engBadge}</div>
      <div class="dork-box">${highlight(build(d.q))}</div>
      <div class="card-acts">
        <button class="btn btn-pink" onclick='runDork(${JSON.stringify(d.q)},${JSON.stringify(d.eng||null)},${JSON.stringify(d.t)})'>▶ Run</button>
        <button class="btn btn-mint" onclick='copyDork(${JSON.stringify(d.q)},${JSON.stringify(d.t)})'>⧉</button>
        <button class="fav ${fav?'on':''}" onclick='toggleFav(${JSON.stringify(currentCat)},${JSON.stringify(d)})'>${fav?"⭐":"☆"}</button>
      </div></div>`;
  }).join("");
}

function renderStats(){
  const total=Object.values(DB).reduce((a,c)=>a+c.dorks.length,0);
  document.getElementById("stat-total").textContent=total;
  document.getElementById("stat-fav").textContent=favs.length;
}

function renderThemes(){
  const box=document.getElementById("themes");
  box.innerHTML=Object.entries(THEMES).map(([k,t])=>
    `<div class="theme-dot" title="${k}" onclick="setTheme('${k}')" style="background:linear-gradient(135deg,${t.pink} 0 50%,${t.mint} 50% 100%)"></div>`
  ).join("");
}

/* ============ ACTIONS ============ */
function switchCat(c){currentCat=c;renderNav();renderGrid();window.scrollTo&&document.querySelector('.content').scrollTo(0,0);}
function toggleEngine(k){
  if(selectedEngines.has(k)){if(selectedEngines.size>1)selectedEngines.delete(k);}
  else selectedEngines.add(k);
  renderEngines();
}
function enginesFor(preferred){
  // if a dork has a preferred engine and it isn't selected, use it; else use all selected
  if(preferred && !selectedEngines.has(preferred)) return [preferred];
  return [...selectedEngines];
}
function needDomain(){
  if(!domain){toast("👀 Hold on","Enter a target domain first!");document.getElementById("target").focus();return false;}
  return true;
}
function runDork(q,pref,title){
  if(q.includes(P)&&!needDomain())return;
  const query=build(q);
  const engs=enginesFor(pref);
  engs.forEach(k=>window.open(ENGINES[k].url(query),"_blank"));
  toast("🚀 Launched",`${title} → ${engs.map(k=>ENGINES[k].name).join(", ")}`);
}
function copyDork(q,title){
  navigator.clipboard.writeText(build(q));
  toast("📋 Copied",`${title}`);
}
function currentList(){
  const data=catData(currentCat);let list=data.dorks;
  if(filter){const f=filter.toLowerCase();list=list.filter(d=>(d.t+" "+d.d+" "+d.q).toLowerCase().includes(f));}
  return list;
}
function runAll(){
  const list=currentList();
  if(list.some(d=>d.q.includes(P))&&!needDomain())return;
  const delay=parseFloat(document.getElementById("delay").value)*1000;
  const perDork=[...selectedEngines].length;
  const tabs=list.length*perDork;
  if(!confirm(`Launch ${list.length} dorks × ${perDork} engine(s) = ${tabs} tabs?\nDomain: ${domain||"(none)"}\nDelay: ${delay/1000}s\n\nTip: allow pop-ups for this page.`))return;
  toast("🎆 Running",`${tabs} tabs, ${delay/1000}s apart`);
  list.forEach((d,i)=>setTimeout(()=>{
    const query=build(d.q);
    enginesFor(d.eng).forEach(k=>window.open(ENGINES[k].url(query),"_blank"));
  },i*delay));
}
function copyAll(){
  const list=currentList();
  const text=list.map(d=>build(d.q)).join("\n");
  navigator.clipboard.writeText(text);
  toast("📋 Copied all",`${list.length} dorks to clipboard`);
}
function exportAll(){
  const list=currentList();
  const header=`# DORK CANDY export\n# Category: ${currentCat}\n# Target: ${domain||"(none)"}\n# ${new Date().toISOString()}\n\n`;
  const text=header+list.map(d=>`## ${d.t} [${d.s}]\n${build(d.q)}\n`).join("\n");
  const blob=new Blob([text],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`dorks_${currentCat.replace(/[^a-z0-9]+/gi,"_").toLowerCase()}.txt`;
  a.click();URL.revokeObjectURL(a.href);
  toast("⬇️ Exported",a.download);
}
function toggleFav(cat,d){
  const srcCat = d._srcCat || cat;
  const id=favId(srcCat,d.t);
  const idx=favs.findIndex(f=>f.id===id);
  if(idx>=0){favs.splice(idx,1);toast("☆ Removed",d.t);}
  else{favs.push({id,em:d.em,t:d.t,d:d.d,s:d.s,q:d.q,eng:d.eng,srcCat});toast("⭐ Saved",d.t);}
  localStorage.setItem(FAV_KEY,JSON.stringify(favs));
  renderNav();renderStats();renderGrid();
}

/* custom builder */
function openBuilder(){document.getElementById("modal").classList.add("show");document.getElementById("cd-title").focus();}
function closeBuilder(){document.getElementById("modal").classList.remove("show");}
function saveCustom(){
  const t=document.getElementById("cd-title").value.trim();
  const q=document.getElementById("cd-dork").value.trim();
  if(!t||!q){toast("👀 Missing","Title and dork required");return;}
  favs.push({id:favId("Custom",t),em:"✨",t,d:"Custom dork",s:"info",q,srcCat:"Custom"});
  localStorage.setItem(FAV_KEY,JSON.stringify(favs));
  document.getElementById("cd-title").value="";document.getElementById("cd-dork").value="";
  closeBuilder();renderNav();renderStats();
  currentCat="⭐ Favorites";renderNav();renderGrid();
  if(q.includes(P)&&!domain){toast("💾 Saved","Set a domain, then Run");}
  else{runDork(q,null,t);}
}

/* theme */
function setTheme(name){
  const t=THEMES[name];if(!t)return;
  const r=document.documentElement.style;
  r.setProperty("--pink",t.pink);r.setProperty("--mint",t.mint);r.setProperty("--lav",t.lav);
  r.setProperty("--sky",t.sky);r.setProperty("--yellow",t.yellow);r.setProperty("--peach",t.peach);
  r.setProperty("--bg",t.bg);
  localStorage.setItem(THEME_KEY,name);
}

/* toast */
let toastTimer;
function toast(t,m){
  document.getElementById("toast-t").textContent=t;
  document.getElementById("toast-m").textContent=m;
  const el=document.getElementById("toast");
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),3200);
}

/* ============ INIT ============ */
function init(){
  setTheme(localStorage.getItem(THEME_KEY)||"candy");
  renderThemes();renderNav();renderEngines();renderGrid();renderStats();

  document.getElementById("target").addEventListener("input",e=>{domain=e.target.value.trim();renderGrid();});
  document.getElementById("search").addEventListener("input",e=>{filter=e.target.value.trim();renderGrid();});
  document.getElementById("delay").addEventListener("input",e=>{document.getElementById("delay-val").textContent=e.target.value+"s";});
  document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeBuilder();});
  document.addEventListener("keydown",e=>{
    if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();document.getElementById("search").focus();}
    if(e.key==="Escape")closeBuilder();
  });
}
init();
</script>
